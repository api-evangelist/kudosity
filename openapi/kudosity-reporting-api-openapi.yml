                          description: Numeric ID of the list
                        name:
                          type: string
                          description: Name of the list
                        created:
                          type: string
                          format: date-time
                          description: 'Date and time that the list was first created. Returned in ISO8601 format YYYY-MM-DD HH:MM:SS in UTC Timezone.

                            '
                        members_active:
                          type: integer
                          description: Count of active members on the list
                        fields:
                          type: array
                          items:
                            type: string
                          description: 'Custom field name. List of custom field names by field_n where n is an integer between 1 and 10.

                            '
                        members_total:
                          type: integer
                          description: Total number of contacts on the list
              examples:
                example-0:
                  summary: Example 1
                  value:
                    page:
                      count: 1
                      number: 1
                    lists_total: 2
