                    error:
                      code: SUCCESS
                      description: OK
                example-1:
                  summary: Example 2
                  value:
                    page:
                      count: 7
                      number: 1
                    total: 61
                    records:
                    - message_id: 331201546
                      datetime_send: '2020-05-14T14:33:25Z'
