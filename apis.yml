name: Kudosity
description: >-
  Kudosity is an Australian business messaging platform — formerly Burst SMS / TransmitSMS — running two live public REST
  APIs on two hosts. The Transmit Message API (v2) covers SMS, MMS, WhatsApp and RCS with API-managed webhooks and sender
  registration; the Transmit SMS API (v1) carries contacts, lists, dedicated virtual numbers, keywords, email-to-SMS and
  all reporting. Both share one account, one set of senders and one bill. Both ship public OpenAPI documents. What makes
  Kudosity unusual for its size is the agent-native surface layered on top: a hosted MCP server whose tools/list answers
  without credentials, llms.txt on both the docs and marketing hosts with per-section fan-out, and five published agent
  integrations — a Claude Code plugin, a GitHub Copilot extension, a Gemini CLI extension, an OpenClaw channel plugin and
  an SMS GitHub Action — all open source in a public GitHub organization. RCS is in beta; there is no voice product, no
  sandbox and no idempotency key.
